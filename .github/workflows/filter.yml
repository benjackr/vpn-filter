name: Filter VPN Nodes

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:       # 支持手动触发

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install net
      
      - name: Run filter script
        run: node scripts/filter.js
      
      - name: Commit and push
        run: |
          git config user.name "VPN Filter Bot"
          git config user.email "bot@github.com"
          git add configs/filtered/
          git commit -m "Auto filter: $(date +%Y-%m-%d_%H:%M)" || exit 0
          git push
