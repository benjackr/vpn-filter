name: Filter VPN Nodes

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 00:00 UTC (北京时间 08:00)
  workflow_dispatch:       # 支持手动触发

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run filter script
        run: node scripts/filter.js
      
      - name: Commit and push
        run: |
          git config user.name "VPN Filter Bot"
          git config user.email "bot@github.com"
          git add configs/filtered/
          git commit -m "Daily filter: $(date +%Y-%m-%d)" || exit 0
          git push
